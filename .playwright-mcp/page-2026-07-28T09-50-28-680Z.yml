  - region "常见问题" [ref=e306]:
    - generic [ref=e307]:
      - generic [ref=e308]:
        - heading "关于我们，你大概想知道这些" [level=2] [ref=e309]
        - paragraph [ref=e310]: 关于配送、价格、食材、餐单与营养成分，这里回答了你能想到的
      - list [ref=e311]:
        - listitem [ref=e313]:
          - generic [ref=e314]:
            - generic [ref=e315]: 配送范围覆盖哪些城市？
            - generic: 目前已覆盖上海、北京、深圳、杭州、成都的主城区，并在持续拓展。下单前 App 会根据你的收货地址自动校验能否送达。
        - listitem [ref=e320]:
          - generic [ref=e321]:
            - generic [ref=e322]: 一餐大概多少钱？
            - generic: 单餐价格在 32–45 元之间，按周订购更划算。你可以先订 3 天体验装，觉得合适再续，不用一次性押上整月。
        - listitem [ref=e327]:
          - generic [ref=e328]:
            - generic [ref=e329]: 可以随时取消或暂停吗？
            - generic: 可以。出差、休假随时在 App 里一键暂停或跳过某几天，未配送的餐费全额保留，不收违约金。
        - listitem [ref=e334]:
          - generic [ref=e335]:
            - generic [ref=e336]: 食材新鲜吗？来源可靠吗？
            - generic: 合作商家接单后现做出餐,保温热链直送,到手还是热的,绝不隔夜。肉蛋来自可追溯供应商,蔬菜每日直采,每一批次留样检测。
        - listitem [ref=e341]:
          - generic [ref=e342]:
            - generic [ref=e343]: 有过敏原或忌口怎么办？
            - generic: 在 App 里标记忌口与过敏原（海鲜、坚果、香菜等），系统会自动避开，营养师也会为你的配餐复核一遍。
        - listitem [ref=e348]:
          - generic [ref=e349]:
            - generic [ref=e350]: 到手怎么加热更好吃？
            - generic: 热链配送到手即食，开盖直接吃。万一凉了，大部分餐品微波 2–3 分钟即可恢复出锅口感，包装上印有针对性的复热建议；沙拉类为冷食设计，冷藏保存、开袋即食。
        - listitem [ref=e355]:
          - generic [ref=e356]:
            - generic [ref=e357]: 餐单是固定的还是我能自己挑？
            - generic: 算法按你的身体数据自动生成一周餐单后，你可以在 App 里对任意一餐进行手动替换——不想吃鱼就换成鸡肉，不爱沙拉就换个热菜，完全灵活。
        - listitem [ref=e362]:
          - generic [ref=e363]:
            - generic [ref=e364]: 能看到每餐的热量和营养成分吗？
            - generic: 当然能。每份餐都标注了热量、蛋白质、碳水和脂肪含量，App 里还能按天查看三大营养素占比，比你自己做笔记还清楚。
